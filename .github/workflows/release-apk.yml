name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch: # Allows you to manually trigger a build from the GitHub Actions tab

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing key from repository secrets (base64 of the .jks); keystore.properties is git-ignored
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          test -n "$version"
          cp app/build/outputs/apk/release/app-release.apk "agora-${version}.apk"
          echo "APK=agora-${version}.apk" >> "$GITHUB_ENV"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber

      - name: Upload artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: agora-release-apk
          path: ${{ env.APK }}
          retention-days: 7

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
