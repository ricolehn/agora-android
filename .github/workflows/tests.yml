name: Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR / branch cancels the run that is still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches the Gradle distribution and dependencies (also the Robolectric android-all jars)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The screenshot renders (ScreenshotTest) need a live server (-Pscreenshots) and are skipped here
      - name: Lint and unit tests
        run: ./gradlew --no-daemon --continue lintDebug testDebugUnitTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          retention-days: 7

  build:
    name: APKs build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release without keystore.properties: unsigned, but with R8 and resource shrinking like the real one
      - name: Build debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
